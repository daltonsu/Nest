<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Autoloop · 事项工作台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-inbox" viewBox="0 0 24 24"><path d="m4 4-3 10v6h22v-6L20 4Z M1 14h6l2 3h6l2-3h6"/></symbol>
<symbol id="i-workflow" viewBox="0 0 24 24"><rect x="2" y="2" width="7" height="7" rx="2"/><rect x="15" y="15" width="7" height="7" rx="2"/><path d="M5 9v9h10M9 5h9v10"/></symbol>
<symbol id="i-plug" viewBox="0 0 24 24"><path d="M8 2v5m8-5v5M5 7h14v4a7 7 0 0 1-14 0ZM12 18v4"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/></symbol>
<symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M12 3v4M1 12v4m22-4v4M8 12v2m8-2v2M9 17h6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7a9 9 0 1 0 1 10M20 2v6h-6"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m7 3 15 9-15 9Z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 9 3 9 3 10H3c0-1 3-1 3-10ZM9 21h6"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M11 4H4v16h16v-7"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
</defs></svg>
<div class="app-shell">
 <aside class="sidebar">
  <a class="brand" href="/" aria-label="Autoloop 首页"><span class="brand-mark">∞</span><span>Autoloop<small>PERSONAL WORKSPACE</small></span></a>
  <nav aria-label="主导航"><button data-nav="work" aria-current="page"><svg><use href="#i-inbox"/></svg>工作台<span id="nav-count" class="nav-count">0</span></button><button data-nav="rules"><svg><use href="#i-workflow"/></svg>规则</button><button data-nav="connections"><svg><use href="#i-plug"/></svg>连接</button></nav>
  <div class="sidebar-bottom"><div class="service-status"><span id="service-dot" class="dot muted"></span><span id="service-label">正在连接中台</span></div><span class="minor">本机工作台 · MVP 0.1</span></div>
 </aside>
 <main>
  <header class="topbar"><div class="breadcrumb">个人空间 <span>/</span> <span id="breadcrumb-page">工作台</span></div><div class="sync"><span id="sync-time">等待同步</span><button id="refresh" class="icon-button" aria-label="立即刷新"><svg><use href="#i-refresh"/></svg></button><span class="local-label">LOCAL</span></div></header>
  <div id="error-banner" class="error-banner" role="alert" hidden></div>
  <section id="work-view" class="view">
   <div class="page-heading"><div><div class="eyebrow" id="today-label">工作台</div><h1 id="headline">正在连接你的 Agent…</h1><p id="subtitle">正在读取事项与执行状态。</p></div><button id="try-button" class="button" disabled><svg><use href="#i-play"/></svg>运行试跑</button></div>
   <div id="filters" class="filters" aria-label="按事项状态筛选"></div>
   <div class="workspace"><section class="task-column" aria-label="事项列表"><div class="list-heading"><span id="list-label">最近事项</span><span id="task-count">—</span></div><div id="task-list"><div class="list-empty">正在载入…</div></div><div id="pagination" class="pagination"></div></section><section id="task-detail" class="detail-column" aria-label="事项详情"><div class="empty-detail"><span class="empty-symbol">∞</span><h2>每件事，都有后续。</h2><p>选择事项，查看进度或做一个决定。</p></div></section></div>
  </section>
  <section id="rules-view" class="view" hidden><div class="page-heading"><div><div class="eyebrow">AUTOMATION</div><h1>规则</h1><p>什么时候开始、交给谁，以及如何跟进。</p></div><span class="subtle-tag">当前生效 · 只读</span></div><div id="rules-content"></div></section>
  <section id="connections-view" class="view" hidden><div class="page-heading"><div><div class="eyebrow">CONNECTIONS</div><h1>连接</h1><p>事件从哪里来，谁来处理，如何通知你。</p></div></div><div id="connections-content"></div></section>
  <footer id="usage-footer" class="usage-footer">用量以中台报告为准。</footer>
 </main>
</div>
<dialog id="action-dialog" aria-labelledby="dialog-title"><form id="action-form"><div class="dialog-head"><span class="eyebrow">确认操作</span><button type="button" class="icon-button" data-close-dialog aria-label="关闭">×</button></div><h2 id="dialog-title"></h2><p id="dialog-description"></p><div id="dialog-fields"></div><p id="dialog-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" class="button" data-close-dialog>取消</button><button type="submit" id="dialog-submit" class="button primary">确认</button></div></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>工作台需要启用 JavaScript 才能查看状态和回答卡片。</noscript>
</body></html>
